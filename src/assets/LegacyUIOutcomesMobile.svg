<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 496" width="360" height="496" role="img" aria-labelledby="out-title out-desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="out-title">Three years of results</title>
  <desc id="out-desc">React upgraded from 16 to 18; builds 60 to 80 percent faster with Vite; 478 TypeScript files added; 305 functional components added; over 140 UNSAFE functions trimmed; 1,092 any types removed.</desc>

  <!-- Single-column phone version of LegacyUIOutcomes.svg -->
  <rect x="0.5" y="0.5" width="359" height="495" rx="14" fill="#13233f" stroke="#2b4166"/>
  <g>
    <text x="24" y="66" font-size="30" font-weight="700" fill="#cf8f55">16 → 18</text>
    <text x="168" y="52" font-size="15" font-weight="600" fill="#e9eef6">React</text>
    <text x="168" y="73" font-size="13" fill="#a9b7cc">version upgrade</text>
  </g>
  <line x1="20" y1="96" x2="340" y2="96" stroke="#2b4166"/>
  <g>
    <text x="24" y="142" font-size="30" font-weight="700" fill="#cf8f55">60–80%</text>
    <text x="168" y="128" font-size="15" font-weight="600" fill="#e9eef6">Faster builds</text>
    <text x="168" y="149" font-size="13" fill="#a9b7cc">Webpack to Vite</text>
  </g>
  <line x1="20" y1="172" x2="340" y2="172" stroke="#2b4166"/>
  <g>
    <text x="24" y="218" font-size="30" font-weight="700" fill="#cf8f55">+478</text>
    <text x="168" y="204" font-size="15" font-weight="600" fill="#e9eef6">TypeScript files</text>
    <text x="168" y="225" font-size="13" fill="#a9b7cc">now 64.5% of the codebase</text>
  </g>
  <line x1="20" y1="248" x2="340" y2="248" stroke="#2b4166"/>
  <g>
    <text x="24" y="294" font-size="30" font-weight="700" fill="#cf8f55">+305</text>
    <text x="168" y="280" font-size="15" font-weight="600" fill="#e9eef6">Functional components</text>
    <text x="168" y="301" font-size="13" fill="#a9b7cc">standard for new code</text>
  </g>
  <line x1="20" y1="324" x2="340" y2="324" stroke="#2b4166"/>
  <g>
    <text x="24" y="370" font-size="30" font-weight="700" fill="#cf8f55">140+</text>
    <text x="168" y="356" font-size="15" font-weight="600" fill="#e9eef6">UNSAFE functions</text>
    <text x="168" y="377" font-size="13" fill="#a9b7cc">trimmed by refactoring</text>
  </g>
  <line x1="20" y1="400" x2="340" y2="400" stroke="#2b4166"/>
  <g>
    <text x="24" y="446" font-size="30" font-weight="700" fill="#cf8f55">−1,092</text>
    <text x="168" y="432" font-size="15" font-weight="600" fill="#e9eef6">any types</text>
    <text x="168" y="453" font-size="13" fill="#a9b7cc">cut in half</text>
  </g>
</svg>
