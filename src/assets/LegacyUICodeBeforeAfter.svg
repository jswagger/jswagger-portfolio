  <text x="50" y="114" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre"><tspan fill="#cf8f55">UNSAFE_componentWillReceiveProps</tspan></text>
  <text x="50" y="133" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">    if (nextProps.records) {</text>
  <text x="50" y="152" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">        for (const item of nextP</text>
