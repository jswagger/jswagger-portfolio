  <text x="50" y="575" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">            ),</text>
  <text x="50" y="594" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">        });</text>
  <text x="50" y="613" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">    }</text>
  <text x="50" y="632" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">};</text>
  <text x="50" y="651" font-size="13" fill="#7f90aa" xml:space="preserve" style="white-space:pre">// render: options={this.state[L</text>
  </g>
  <rect x="247" y="305" width="104" height="360" fill="url(#fade)"/>
  <path d="M366 344 H392 M385 338 L393 344 L385 350" fill="none" stroke="#cf8f55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="408" y="266" width="320" height="173" rx="10" fill="#0f1c33" stroke="#2b4166"/>
  <line x1="408" y1="304" x2="728" y2="304" stroke="#2b4166"/>
  <text x="426" y="291" font-size="14" font-weight="600" fill="#cf8f55" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">After</text>
  <g font-family="'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" clip-path="url(#clip-a2)">
  <text x="426" y="328" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">getPlantTypeOptions = <tspan fill="#cf8f55">memoize</tspan>Sel</text>
  <text x="426" y="347" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">    prepareSelectableOptions(opt</text>
  <text x="426" y="366" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">);</text>
  <text x="426" y="404" font-size="13" fill="#7f90aa" xml:space="preserve" style="white-space:pre">// render:</text>
  <text x="426" y="423" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">options={this.getPlantTypeOption</text>
  </g>
  <rect x="623" y="305" width="104" height="132" fill="url(#fade)"/>
  <text x="408" y="467" font-size="14" fill="#a9b7cc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">State copied from props becomes a</text>
