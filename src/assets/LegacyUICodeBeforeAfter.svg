  <text x="426" y="133" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">render() { ... records={this.get</text>
  </g>
  <rect x="623" y="91" width="104" height="56" fill="url(#fade)"/>
  <text x="408" y="177" font-size="14" fill="#a9b7cc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">A lifecycle loop becomes a memoized</text>
  <text x="408" y="197" font-size="14" fill="#a9b7cc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">getter used in render.</text>
