<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 699" width="760" height="699" role="img" aria-labelledby="cba-title cba-desc">
  <title id="cba-title">Code before and after</title>
  <desc id="cba-desc">Two refactors shown as before and after pairs. In each, an UNSAFE_componentWillReceiveProps lifecycle method is replaced by a memoized getter or selector that is used in render. Code lines are excerpts and fade out at the right edge.</desc>
