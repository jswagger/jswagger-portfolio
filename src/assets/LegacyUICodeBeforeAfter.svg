      <stop offset="0" stop-color="#0f1c33" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#0f1c33" stop-opacity="1"/>
      <stop offset="1" stop-color="#0f1c33" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="clip-b1"><rect x="32" y="91" width="320" height="114"/></clipPath>
