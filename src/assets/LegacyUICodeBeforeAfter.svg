  <text x="50" y="190" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">}</text>
  </g>
  <rect x="247" y="91" width="104" height="113" fill="url(#fade)"/>
  <path d="M366 130 H392 M385 124 L393 130 L385 136" fill="none" stroke="#cf8f55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="408" y="52" width="320" height="97" rx="10" fill="#0f1c33" stroke="#2b4166"/>
