  <text x="50" y="461" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">initializePlantType = (nextProps</text>
  <text x="50" y="480" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">    if (nextProps[PICKLIST_PLANT</text>
  <text x="50" y="499" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">        this.setState({</text>
  <text x="50" y="518" font-size="13" fill="#e9eef6" xml:space="preserve" style="white-space:pre">            [PICKLIST_PLANT_TYPE</text>
